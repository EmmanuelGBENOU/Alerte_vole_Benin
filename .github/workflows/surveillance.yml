name: Surveillance voyage.benin.bj

on:
  schedule:
    - cron: "*/10 * * * *"   # filet de sécurité : GitHub ne garantit pas cet horaire (voir README)
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        options: [verifier, test, bilan]
        default: verifier

permissions:
  contents: write   # pour sauvegarder etat.json

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier le site
        run: python3 surveille_site.py $MODE   # Python du serveur GitHub : aucune dépendance
        env:
          MODE: ${{ inputs.mode == 'bilan' && '--bilan' || inputs.mode == 'test' && '--test' || '' }}
          LIEN_ARRET: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/surveillance.yml
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour de l'état"
          git pull --rebase --quiet && git push
